apply_preset:
  target:
    entity:
      integration: skylight_family
  fields:
    preset:
      required: true
      example: "Toddler"
      selector:
        text:

set_star:
  target:
    entity:
      integration: skylight_family
  fields:
    star:
      # Leave this out entirely to drop the manual override and let the day
      # go back to being decided by whether the chores got done.
      required: false
      selector:
        boolean:
    date:
      required: false
      example: "2026-10-05"
      selector:
        date:

add_money:
  target:
    entity:
      integration: skylight_family
  fields:
    account:
      required: true
      selector:
        select:
          options:
            - label: Short term
              value: short
            - label: Long term
              value: long
    kind:
      required: true
      selector:
        select:
          options:
            - label: Deposit
              value: deposit
            - label: Expense
              value: expense
            - label: Transfer
              value: transfer
    to_account:
      # Only used when kind is transfer: the account the money moves into.
      required: false
      selector:
        select:
          options:
            - label: Short term
              value: short
            - label: Long term
              value: long
    amount:
      required: true
      example: 2.50
      selector:
        number:
          min: 0.01
          max: 100000
          step: 0.01
          mode: box
    date:
      # Any date up to today, so a forgotten expense goes in where it
      # belongs and the interest after it is recalculated.
      required: false
      example: "2026-10-06"
      selector:
        date:
    note:
      required: false
      example: "Allowance"
      selector:
        text:
